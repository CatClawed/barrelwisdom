<div
  [class]="small ? 'card card-small' : url ? 'card' : 'card card-dialog'"
  [style]="url ? 'height:100%;' : null">
  @if (url) {
    <h4 class="card-title" style="margin-right:6rem;">
      <a (click)="$event.preventDefault(); buttonClicked.emit(item.slug ? item.slug : item.id);"
        href="{{url}}">{{item.name}}</a>
    </h4>
  }
  @else {
    <h4 class="card-title" style="margin-right:6rem;">{{item.name}}</h4>
  }
  <div class="card-icon-position">
    <ng-content select="[icon]"></ng-content>
  </div>
  @if (imgURL) {
    <div class="card-item-display">
      @if (url) {
        <a (click)="$event.preventDefault(); buttonClicked.emit(item.slug ? item.slug : item.id);"
          href="{{url}}">
          <img src="{{imgURL}}" alt="{{item.name}}"
            style="aspect-ratio: 1; width: {{dimension}}px;">
        </a>
      }
      @else {
        <img src="{{imgURL}}" alt="{{item.name}}"
          style="aspect-ratio: 1; width: {{dimension}}px;">
      }
    </div>
  }
  <ng-content></ng-content>
  @if (!hideButton) {
    <button class="card-read-more-position"
      mat-mini-fab color="primary"
      (click)="buttonClicked.emit(item.slug ? item.slug : item.id)">
      <svg><use href="/media/spritesheets/main.svg?v=1#fa-vertical-ellipsis"></use></svg>
    </button>
  }
</div>
