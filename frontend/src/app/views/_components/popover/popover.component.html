<a (click)="$event.preventDefault(); toggle();"
    [attr.href]="url ? url : null"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    class="{{cls}} dotted-link"
    style="display:{{display}};cursor:pointer;">
    <ng-content />
</a>

<ng-template cdkConnectedOverlay
    (overlayOutsideClick)="timeToggle();"
    (overlayKeydown)="$event.key === 'Escape' ? isOpen = false : true"
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen">
    <div class="popover2">
        @if (name) {
            <h4>{{name}}</h4>
        }
        <div class="popoverContents">
            @if (template) {
                <ng-container *ngTemplateOutlet="template; context: context"></ng-container>
            }
            @else { {{text}} }
        </div>
    </div>
</ng-template>
