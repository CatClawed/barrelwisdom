@if (!error) {
  <ng-template #template let-trait="item">
    <a12-trait
      (buttonClicked)="openDialog($event)"
      [inputData]="trait"
      url="/{{gameURL}}/traits/{{trait.slug}}/{{language}}"
      [gameURL]="gameURL">
    </a12-trait>
  </ng-template>
  <filter-list
    [list]="filteredTraits"
    name="Traits"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-8" appearance="outline">
        <mat-label>Filter...</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
      <mat-form-field class="grid-4" appearance="outline">
        <mat-label>Transfers to...</mat-label>
        <mat-select matNativeControl formControlName="transfers" disableOptionCentering="true" class="mat-select-icon">
          <mat-option value="1" selected> --</mat-option>
          @for (t of [
              ['3',  'bomb', 'Heal'],
              ['5',  'weapon', 'Weapon'],
              ['6',  'armor', 'Armor'],
              ['7',  'accessory', 'Accessory'],
            ]; track $index) {
            <mat-option [value]="t[0]" class="svg-icon-text-vertical-center">
              <svg class="svg-icon-standard right-spacer">
                <use attr.href="/media/spritesheets/A15.svg?v=1#{{t[1]}}"></use>
              </svg>
              {{t[2]}}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  </filter-list>
}
