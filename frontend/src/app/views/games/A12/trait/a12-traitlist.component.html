@if (!error) {
  <ng-template #template let-trait="item">
    <a12-trait
      (buttonClicked)="openDialog($event)"
      [inputData]="trait"
      url="/{{gameURL}}/traits/{{trait.slug}}/{{language}}"
      [gameURL]="gameURL">
    </a12-trait>
  </ng-template>
  <filter-list
    [list]="filteredTraits"
    [name]="a12service.trait_translation[language]"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-6" appearance="outline">
        <mat-label>{{a12service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
      <div class="grid-6">
        @for (btn of [
          { ctrl: pageForm.controls.atk,  icon: 'bomb' },
          { ctrl: pageForm.controls.wep,  icon: 'weapon' },
          { ctrl: pageForm.controls.arm,  icon: 'armor' },
          { ctrl: pageForm.controls.acc,  icon: 'accessory' }
        ]; track $index) {
          <button type="button" 
                  class="icon-button" 
                  (click)="toggle(btn.ctrl)"
                  [class.active]="btn.ctrl.value">
            <svg>
              <use attr.href="/media/spritesheets/A12.svg?v=1#{{btn.icon}}"></use>
            </svg>
          </button>
        }
      </div>
    </form>
  </filter-list>
}
