@if (!error) {
  <ng-template #template let-mon="item">
    <item
      [item]="mon"
      url="/{{gameURL}}/monsters/{{mon.slug}}/{{language}}"
      (buttonClicked)="openDialog($event)"
      dimension="257"
      imgURL="{{imgURL}}monsters/{{mon.slug}}.webp?v=1">
      <ng-container icon>
        <span>{{mon.race}}</span>
        @if (mon.isDX) {
          <br /><span class="badge bg-primary">DX</span>
        }
      </ng-container>
    </item>
  </ng-template>
  <filter-list
    [list]="filteredMonsters"
    [name]="a12service.monster_translation[language]"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-12" appearance="outline">
        <mat-label>{{a12service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
    </form>
  </filter-list>
}
