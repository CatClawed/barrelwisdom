@if (!error) {
  <ng-template #template let-trait="item">
    <a23-trait
      (buttonClicked)="openDialog($event)"
      [inputData]="trait"
      url="/{{gameURL}}/traits/{{trait.slug}}/{{language}}"
      [gameURL]="gameURL">
    </a23-trait>
  </ng-template>
  <filter-list
    [list]="filteredTraits"
    name="{{a23service.trait_translation[language]}}"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-12" appearance="outline">
        <mat-label>{{a23service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
      <div class="grid-12">
        <filter-buttons svg="A23.svg?v=1" style="float:left"
          [list]="[
            { ctrl: pageForm.controls.atk,  icon: 'type-attack' },
            { ctrl: pageForm.controls.heal, icon: 'type-heal' },
            { ctrl: pageForm.controls.dbf,  icon: 'type-debuff' },
            { ctrl: pageForm.controls.buff, icon: 'type-buff' },
          ]">
        </filter-buttons>
        <filter-buttons svg="A23.svg?v=1" style="float:left"
          [list]="[
            { ctrl: pageForm.controls.wpn, icon: 'type-weapon' },
            { ctrl: pageForm.controls.arm, icon: 'type-armor' },
            { ctrl: pageForm.controls.acc, icon: 'type-accessory' },
            { ctrl: pageForm.controls.tal, icon: 'category-talismans' },
            { ctrl: pageForm.controls.exp, icon: 'type-exploration' },
          ]">
        </filter-buttons>
      </div>
    </form>
  </filter-list>
}
