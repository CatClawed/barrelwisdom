@if (!error) {
  <ng-template #template let-item="item">
    <a25rw-effect (buttonClicked)="openDialog($event)" [inputData]="item" [gameURL]="gameURL"
      [hideContents]="true"></a25rw-effect>
  </ng-template>
  <filter-list
    [list]="filteredEffects"
    [(hide)]="hide"
    name="{{a25rwservice.effect_translation[language]}}"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-12" appearance="outline">
        <mat-label>{{a25rwservice.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
    </form>
  </filter-list>
}
