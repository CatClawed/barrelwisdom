@if (data; as category) {
  <ng-template #cat let-item="item" let-add="add">
    <tr>
      <td>
        <a routerLink="/{{gameURL}}/items/{{item.id}}/{{language}}">{{item.name}}</a>
        @if (add) { - {{a25rwservice.effect_translation[language]}} }
        @if (item.dlc) { <span style="margin-left: 0.5em;" class="badge bg-primary">DLC</span> }
      </td>
    </tr>
  </ng-template>
  <category
    [name]="category.name"
    [using]="category.used !== undefined"
    [colspan]="1">
    <ng-container inCategory>
      @for (item of category.items; track item) {
        <ng-content *ngTemplateOutlet="cat;context:{item:item}"></ng-content>
      }
      @for (item of category.addcat; track item) {
        <ng-content *ngTemplateOutlet="cat;context:{item:item, add:true}"></ng-content>
      }
    </ng-container>
    <ng-container usingCategory>
      @for (item of category.used; track item) {
        <ng-content *ngTemplateOutlet="cat;context:{item:item}"></ng-content>
      }
    </ng-container>
  </category>
}
