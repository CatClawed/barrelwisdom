@if (!error) {
  <ng-template #template let-trait="item">
    <a22-trait
      (buttonClicked)="openDialog($event)"
      [inputData]="trait"
      url="/{{gameURL}}/traits/{{trait.slug}}/{{language}}"
      [gameURL]="gameURL">
    </a22-trait>
  </ng-template>
  <filter-list
    [list]="filteredTraits"
    name="{{a22service.trait_translation[language]}}"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-6" appearance="outline">
        <mat-label>{{a22service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">

      </mat-form-field>
      <filter-buttons class="grid-6" svg="A22.svg?v=1"
        [list]="[
          { ctrl: pageForm.controls.attack,  icon: 'type-attack' },
          { ctrl: pageForm.controls.heal,  icon: 'type-heal' },
          { ctrl: pageForm.controls.debuff,  icon: 'type-debuff' },
          { ctrl: pageForm.controls.buff,  icon: 'type-buff' },
          { ctrl: pageForm.controls.weapon,  icon: 'type-weapon' },
          { ctrl: pageForm.controls.armor,  icon: 'type-armor' },
          { ctrl: pageForm.controls.accessory,  icon: 'type-accessory' }
        ]">
      </filter-buttons>
    </form>
  </filter-list>
}
