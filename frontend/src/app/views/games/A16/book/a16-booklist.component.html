@if (!error) {
  <ng-template #template let-item="item">
    <a16-book
      [inputData]="item"
      (buttonClicked)="openDialog($event)"
      [gameURL]="gameURL"
      [imgURL]="imgURL"></a16-book>
  </ng-template>
  <filter-list
    [list]="filteredBooks"
    [name]="a16service.recipebook_translation[language]"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-12" appearance="outline">
        <mat-label>{{a16service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
    </form>
  </filter-list>
}
