@if (!error) {
  <ng-template #template let-trait="item">
    <a18-trait
      (buttonClicked)="openDialog($event)"
      [inputData]="trait"
      url="/{{gameURL}}/traits/{{trait.slug}}/{{language}}"
      [gameURL]="gameURL">
    </a18-trait>
  </ng-template>
  <filter-list
    [list]="filteredTraits"
    name="{{a18service.trait_translation[language]}}"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-6" appearance="outline">
        <mat-label>{{a18service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">

      </mat-form-field>
      <filter-buttons class="grid-6" svg="A18.svg?v=1"
        [list]="[
          { ctrl: pageForm.controls.syn,  icon: 'synthesis' },
          { ctrl: pageForm.controls.atk,  icon: 'attack' },
          { ctrl: pageForm.controls.heal, icon: 'heal' },
          { ctrl: pageForm.controls.wep,  icon: 'weapon' },
          { ctrl: pageForm.controls.arm,  icon: 'armor' },
          { ctrl: pageForm.controls.acc,  icon: 'accessory' }
        ]">
      </filter-buttons>
    </form>
  </filter-list>
}
