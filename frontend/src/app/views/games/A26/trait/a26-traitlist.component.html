@if (!error) {
  <ng-template #template let-trait="item">
    <a26-trait
      (buttonClicked)="openDialog($event)"
      [inputData]="trait"
      url="/{{gameURL}}/traits/{{trait.id}}/{{language}}"
      [imgURL]="imgURL"
      [gameURL]="gameURL">
    </a26-trait>
  </ng-template>
  <filter-list
    [list]="filteredTraits"
    name="{{a26service.trait_translation[language]}}"
    [(hide)]="hide"
    [template]="template">
    <form [formGroup]="pageForm" class="grid">
      <mat-form-field class="grid-6" appearance="outline">
        <mat-label>{{a26service.filter_translation[language]}}</mat-label>
        <input style="height: 100%;" matInput formControlName="filtertext">
      </mat-form-field>
      <filter-buttons class="grid-6" svg="A26.svg?v=1"
        [list]="[
          { ctrl: pageForm.controls.atk,  icon: 'category-bombs' },
          { ctrl: pageForm.controls.heal, icon: 'trait-heal' },
          { ctrl: pageForm.controls.buff, icon: 'trait-buff' },
          { ctrl: pageForm.controls.dbf,  icon: 'trait-debuff' },
          { ctrl: pageForm.controls.wep,  icon: 'category-weapons' },
          { ctrl: pageForm.controls.arm,  icon: 'category-armor' },
          { ctrl: pageForm.controls.acc,  icon: 'category-accessories' },
        ]">
      </filter-buttons>
    </form>
  </filter-list>
}
