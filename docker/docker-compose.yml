services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: postgres
    restart: always
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    volumes:
      - bw_database:/var/lib/postgresql
    ports:
      - 5432:5432

  backend:
    container_name: backend
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.django
      args:
        UID: ${UID}
        GID: ${GID}
    ports:
    - 8000:8000
    environment:
      - 'SECRET_KEY=${SECRET_KEY}'
      - 'DEBUG=${DEBUG}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    depends_on:
      - postgres
    volumes:
      - ../backend:/backend

volumes:
  bw_database: {}
