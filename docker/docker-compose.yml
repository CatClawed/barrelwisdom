services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: postgres
    restart: always
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    volumes:
      - bw_database:/var/lib/postgresql/data
    ports:
      - 5432:5432

  backend:
    container_name: backend
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.django
      args:
        UID: ${UID}
        GID: ${GID}
    ports:
    - 8000:8000
    environment:
      - 'SECRET_KEY=${SECRET_KEY}'
      - 'DEBUG=${DEBUG}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    depends_on:
      - postgres
    volumes:
      - ../backend:/backend

  frontend:
    container_name: frontend
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.angular
    ports:
      - 4200:4200
    volumes:
      - ../frontend:/frontend
      - nodemodules:/frontend/node_modules
    extra_hosts:
      - "localhost:host-gateway"

  redis:
    container_name: valkey
    image: valkey/valkey:9.0.3-alpine3.23
    ports:
      - "6379:6379"

# For local testing of production build
  frontend_prod:
    container_name: frontend_prod
    image: frontend_prod:latest
    ports:
      - 127.0.0.1:4000:4000

  nginx:
    container_name: nginx
    depends_on:
      - frontend_prod
      - backend
    build:
      dockerfile: ./Dockerfile.nginx
    ports:
      - 80:80

volumes:
  bw_database: {}
  nodemodules: {}